<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prueba OCR Neumáticos</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            font-size: 26px;
        }

        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            background: #000;
        }

        button {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            background: #ff4b00;
            color: white;
        }

        #resultado {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: left;
        }

        .dato {
            font-size: 20px;
            margin: 15px 0;
        }

        #textoOCR {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>


<body>

    <h1>📷 LECTOR DE ETIQUETAS</h1>

    <p>
        Coloca la medida y la marca dentro de la cámara.
    </p>


    <video
        id="video"
        autoplay
        playsinline
    ></video>


    <button
        id="btnCapturar"
    >
        📷 LEER ETIQUETA
    </button>


    <div id="resultado">

        <div class="dato">
            <strong>MARCA:</strong>
            <span id="marca">
                —
            </span>
        </div>


        <div class="dato">
            <strong>MEDIDA:</strong>
            <span id="medida">
                —
            </span>
        </div>


        <div id="estado">
            Esperando lectura...
        </div>


        <div id="textoOCR"></div>

    </div>


    <canvas
        id="canvas"
        style="display:none;"
    ></canvas>


    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


    <script>

        const video =
            document.getElementById(
                "video"
            );

        const canvas =
            document.getElementById(
                "canvas"
            );

        const btnCapturar =
            document.getElementById(
                "btnCapturar"
            );

        const marca =
            document.getElementById(
                "marca"
            );

        const medida =
            document.getElementById(
                "medida"
            );

        const estado =
            document.getElementById(
                "estado"
            );

        const textoOCR =
            document.getElementById(
                "textoOCR"
            );


        /*
         * ABRIR CÁMARA
         */

        async function iniciarCamara() {

            try {

                const stream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            video: {
                                facingMode: {
                                    ideal: "environment"
                                }
                            },
                            audio: false
                        });


                video.srcObject =
                    stream;


                estado.innerText =
                    "Cámara lista. Apunta a la etiqueta.";

            }

            catch (error) {

                console.error(
                    error
                );

                estado.innerText =
                    "❌ No se pudo abrir la cámara.";

            }

        }


        /*
         * CAPTURAR IMAGEN
         */

        btnCapturar.addEventListener(
            "click",
            async function () {

                estado.innerText =
                    "⏳ Analizando etiqueta...";

                marca.innerText =
                    "—";

                medida.innerText =
                    "—";


                const ancho =
                    video.videoWidth;

                const alto =
                    video.videoHeight;


                canvas.width =
                    ancho;

                canvas.height =
                    alto;


                const contexto =
                    canvas.getContext(
                        "2d"
                    );


                contexto.drawImage(
                    video,
                    0,
                    0,
                    ancho,
                    alto
                );


                /*
                 * OCR
                 */

                try {

                    const resultado =
                        await Tesseract.recognize(
                            canvas,
                            "eng",
                            {
                                logger:
                                    info => {

                                        if (
                                            info.status
                                        ) {

                                            estado.innerText =
                                                info.status +
                                                " " +
                                                Math.round(
                                                    (
                                                        info.progress ||
                                                        0
                                                    ) * 100
                                                ) +
                                                "%";

                                        }

                                    }
                            }
                        );


                    const texto =
                        resultado.data.text;


                    console.log(
                        "======================"
                    );

                    console.log(
                        "TEXTO OCR:"
                    );

                    console.log(
                        texto
                    );

                    console.log(
                        "======================"
                    );


                    textoOCR.innerText =
                        texto;


                    /*
                     * BUSCAR MARCA
                     */

                    const marcas = [

                        "SUNNY",
                        "GOODYEAR",
                        "PIRELLI",
                        "DUNLOP",
                        "MICHELIN",
                        "BRIDGESTONE",
                        "FIRESTONE",
                        "YOKOHAMA",
                        "HANKOOK",
                        "KUMHO",
                        "CONTINENTAL",
                        "TOYO",
                        "MAXXIS",
                        "LINGLONG",
                        "COMPASAL",
                        "ONYX",
                        "HILO",
                        "JOYROAD",
                        "KAPSEN",
                        "ZEXTOUR"

                    ];


                    const textoMayus =
                        texto.toUpperCase();


                    let marcaEncontrada =
                        "";


                    for (
                        const nombre
                        of marcas
                    ) {

                        if (
                            textoMayus.includes(
                                nombre
                            )
                        ) {

                            marcaEncontrada =
                                nombre;

                            break;

                        }

                    }


                    /*
                     * BUSCAR MEDIDA
                     *
                     * Ejemplos:
                     *
                     * 225/45ZR17
                     * 185/65R15
                     * 265/65R17
                     * 185R14
                     */

                    let medidaEncontrada =
                        "";


                    /*
                     * MEDIDAS CON PERFIL
                     */

                    const patronMedida =
                        /(\d{3})\s*[\/\-]\s*(\d{2,3})\s*(?:Z?R)\s*(\d{2})/i;


                    const coincidencia =
                        textoMayus.match(
                            patronMedida
                        );


                    if (
                        coincidencia
                    ) {

                        const ancho =
                            coincidencia[1];

                        const perfil =
                            coincidencia[2];

                        const aro =
                            coincidencia[3];


                        medidaEncontrada =
                            ancho +
                            "/" +
                            perfil +
                            "R" +
                            aro;

                    }


                    /*
                     * MEDIDAS SIN PERFIL
                     *
                     * Ejemplo:
                     *
                     * 185R14
                     */

                    if (
                        !medidaEncontrada
                    ) {

                        const patronSinPerfil =
                            /\b(\d{3})\s*R\s*(\d{2})\b/i;


                        const sinPerfil =
                            textoMayus.match(
                                patronSinPerfil
                            );


                        if (
                            sinPerfil
                        ) {

                            medidaEncontrada =
                                sinPerfil[1] +
                                "R" +
                                sinPerfil[2];

                        }

                    }


                    /*
                     * MOSTRAR RESULTADO
                     */

                    marca.innerText =
                        marcaEncontrada ||
                        "NO DETECTADA";


                    medida.innerText =
                        medidaEncontrada ||
                        "NO DETECTADA";


                    if (
                        marcaEncontrada &&
                        medidaEncontrada
                    ) {

                        estado.innerText =
                            "✅ PRODUCTO IDENTIFICADO";

                    }

                    else {

                        estado.innerText =
                            "⚠️ Falta reconocer algún dato.";

                    }

                }

                catch (error) {

                    console.error(
                        error
                    );

                    estado.innerText =
                        "❌ Error durante el reconocimiento.";

                }

            }
        );


        iniciarCamara();

    </script>

</body>

</html>
